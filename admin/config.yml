backend:
  name: github
  repo: anubhavxverma07/deepbysoniauracandles
  branch: main

media_folder: "images"
public_folder: "/images"

collections:
  - name: "products"
    label: "Products"
    files:
      - name: "all"
        label: "All Products"
        file: "content/products.json"
        fields:
          - label: "Product List"
            name: "products"
            widget: "list"
            fields:
              - {label: "Product ID", name: "id", widget: "string"}
              - {label: "Product Name", name: "name", widget: "string"}
              - {label: "Category", name: "cat", widget: "select", options: ["sculptural", "jar", "gourmet", "festive", "gifting", "baby"]}
              - {label: "Price", name: "price", widget: "number", value_type: "int"}
              - {label: "Combo", name: "combo", widget: "string", required: false}
              - {label: "Scent", name: "scent", widget: "string"}
              - {label: "Description", name: "desc", widget: "text"}
              - {label: "Badge", name: "badge", widget: "string", required: false}
              - {label: "Photos", name: "images", widget: "list", field: {label: "Photo", name: "image", widget: "image"}}
              - {label: "In Stock", name: "instock", widget: "boolean", default: true}